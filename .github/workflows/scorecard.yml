name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  branch_protection_rule:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard / analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read            # check out the code
      actions: read             # read workflow runs (needed when the repo is private)
      security-events: write    # upload the SARIF to code scanning
      id-token: write           # publish_results signs the result for the public API
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
